name: CI/CD

# Hela kedjan, från commit till produktion:
#
#   Pull request mot main:
#     verify (testa & bygg) → publish (bygg imagen, men logga inte in och pusha inte)
#     Ingenting deployas.
#
#   Push till main:
#     verify           testa och bygg koden
#       ↓ needs
#     publish          bygg imagen EN gång, tagga med commitens sha, pusha till GHCR
#       ↓ needs
#     deploy           be Render köra exakt den imagen i staging och vänta tills
#                      /version.txt visar samma sha
#       ↓ needs
#     deploy-production  pausar tills en required reviewer godkänner (miljön "production"),
#                      ber sedan Render köra SAMMA image (samma sha, ingen ny build)
#                      i produktion och verifierar via /version.txt
#
# Med reviewern på production är det Continuous Delivery, utan den Continuous Deployment.
# workflow_dispatch = knappen "Run workflow" under Actions, om du vill köra om för hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test & bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build

  publish:
    name: Image → GHCR
    runs-on: ubuntu-latest
    needs: verify # bara testad kod blir en image
    permissions:
      contents: read
      packages: write # får pusha till GitHub Container Registry
    steps:
      - uses: actions/checkout@v5

      # GHCR kräver små bokstäver, och repot kan heta Kraftly-Nisse. ${VAR,,} = gemener i bash.
      - name: Imagenamn
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Bygg en gång, tagga med commitens sha. Samma image går sedan till staging (och i vecka 6 till prod).
      - name: Bygg imagen
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .

      - run: docker image ls "$IMAGE" --format "{{.Repository}}:{{.Tag}}  {{.Size}}"

      - name: Logga in på GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # ingen egen hemlighet behövs – GitHub skapar en per körning

      - name: Pusha
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"

  deploy:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Hemligheten och variabeln nedan ligger i GitHub-miljön "staging"
    # (Settings → Environments → staging). Körningen syns under Deployments på repots startsida.
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false # avbryt aldrig en deploy halvvägs
    steps:
      - name: Be Render köra exakt den här imagen
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK saknas i miljön staging – hoppar över deploy (övning 1, steg 1)"
            exit 0
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          # imgURL måste URL-kodas: ghcr.io/a/b:sha → ghcr.io%2Fa%2Fb%3Asha
          ENCODED=$(jq -rn --arg u "$IMAGE" '$u|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"
          echo
          echo "Render har tagit emot $IMAGE"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Vänta tills staging kör den här committen
        if: steps.hook.outputs.deployed == 'true'
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::Variabeln STAGING_URL saknas i miljön staging – kan inte verifiera"
            exit 0
          fi
          URL="${URL%/}" # utan avslutande snedstreck
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "$URL/version.txt" 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "✅ $URL kör $GITHUB_SHA"
              exit 0
            fi
            echo "Försök $i/30: staging kör ${LIVE:-(inget svar ännu)} – väntar 10 s"
            sleep 10
          done
          echo "::error::Staging kör fortfarande inte $GITHUB_SHA efter 5 minuter. Kolla Events/Logs i Render."
          exit 1
  deploy-production:
    name: Deploy → produktion
    runs-on: ubuntu-latest
    needs: deploy # samma sha som just verifierades i staging – ingen ny build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Miljön "production" har en required reviewer. Jobbet väntar tills någon godkänner
    # under Actions → körningen → Review deployments. Med reviewern: Continuous Delivery.
    # Utan: Continuous Deployment. Det är hela skillnaden.
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Be Render köra exakt den här imagen i produktion
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }} # samma namn som i staging – men miljön production har sitt EGET värde
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK saknas i miljön production – hoppar över (övning 1, steg 2)"
            exit 0
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          ENCODED=$(jq -rn --arg u "$IMAGE" '$u|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"
          echo
          echo "Render har tagit emot $IMAGE (produktion)"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Vänta tills produktion kör den här committen
        if: steps.hook.outputs.deployed == 'true'
        env:
          URL: ${{ vars.PROD_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::Variabeln PROD_URL saknas i miljön production – kan inte verifiera"
            exit 0
          fi
          URL="${URL%/}"
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "$URL/version.txt" 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "✅ $URL kör $GITHUB_SHA"
              exit 0
            fi
            echo "Försök $i/30: produktion kör ${LIVE:-(inget svar ännu)} – väntar 10 s"
            sleep 10
          done
          echo "::error::Produktion kör fortfarande inte $GITHUB_SHA efter 5 minuter. Kolla Events/Logs i Render."
          exit 1
